name: grok-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Grok CLI
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Review PR
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GROK_DISABLE_AUTOUPDATER: "1"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.grok/bin:$PATH"
          grok -p "Review this PR for bugs. Post a GitHub review with findings. Do not edit files, push, or merge." --always-approve
